services:
  postgres:
    image: postgres:15
    container_name: suppliersense_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: suppliersense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: suppliersense_redis
    ports:
      - "6379:6379"

  api:
    image: python:3.11-slim
    container_name: suppliersense_api
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  worker:
    image: python:3.11-slim
    container_name: suppliersense_worker
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      - redis
      - postgres
    command: >
      sh -c "pip install -r requirements.txt &&
             celery -A worker.celery_app.celery_app worker --loglevel=info"

volumes:
  postgres_data: