version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: suppliersense_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: suppliersense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: suppliersense_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    image: python:3.11-slim
    container_name: suppliersense_api
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install fastapi uvicorn &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.example

volumes:
  postgres_data: